<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>わんにゃんごはんカルテ プレビュー</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --milk:#FFFBF5;
    --pink-beige:#F4E4D8;
    --pink-beige-soft:#FAF0E7;
    --sage:#8FA88A;
    --sage-tint:#EAF1E8;
    --coral:#DD7259;
    --coral-tint:#FBEAE3;
    --brown:#4A3A2C;
    --brown-60:#8B7C6B;
    --rule:#E7DACB;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#EDE6DA;color:var(--brown);font-family:'Noto Sans JP',sans-serif}
  .doc{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0 60px}
  .pdfpage{
    width:210mm;height:297mm;background:var(--milk);position:relative;
    box-shadow:0 22px 50px -18px rgba(74,58,44,.35),0 3px 10px rgba(74,58,44,.12);
    overflow:hidden;flex:none;
  }
  .pdfpage .inner{position:absolute;inset:0;padding:20mm 18mm 16mm}
  .pagefoot{
    position:absolute;left:18mm;right:18mm;bottom:10mm;
    display:flex;justify-content:space-between;align-items:center;
    font-size:9pt;color:var(--brown-60);letter-spacing:.03em;
  }
  .pagefoot .mark{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;color:var(--sage)}
  .rule{height:1px;background:var(--rule);border:none;margin:0}
  .eyebrow{font-size:9.5pt;letter-spacing:.16em;color:var(--sage);font-weight:700}
  .ptitle{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:22pt;color:var(--brown);margin:4pt 0 0}
  .byline{font-size:10pt;color:var(--brown-60);margin-top:3pt}
  @media print{
    html,body{background:#fff}
    .doc{padding:0;gap:0}
    .pdfpage{box-shadow:none;page-break-after:always}
    .pdfpage:last-child{page-break-after:auto}
    .admin-bar{display:none}
    @page{size:A4;margin:0}
  }

  /* ===== 世界観統一：犬種イラスト／ころて共通の円形フレーム ===== */
  .char-frame{
    border-radius:50%;background:var(--pink-beige-soft);border:2.5px solid var(--pink-beige);
    display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none;
  }
  .char-frame img{width:82%;height:auto;object-fit:contain;transform:translateY(3mm)}

  /* ===== P1 表紙 ===== */
  .p1 .inner{padding:16mm 16mm;display:flex;flex-direction:column}
  .p1-frame{position:absolute;inset:9mm;border:1px solid var(--pink-beige);pointer-events:none}
  .p1-frame:after{content:"";position:absolute;inset:2.4mm;border:1px solid var(--pink-beige)}
  .p1-topline{display:flex;justify-content:space-between;align-items:flex-start;flex:none}
  .p1-brand{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:10.5pt;color:var(--sage);letter-spacing:.06em}
  .p1-stamp{width:26.5mm;height:26.5mm;flex:none;position:relative}
  .p1-stamp svg{width:100%;height:100%;overflow:visible}
  .p1-stamp .ring{fill:none;stroke:var(--coral)}
  .p1-stamp .arc-label{font-size:6.6px;letter-spacing:2.4px;font-weight:700;fill:var(--coral);font-family:'Zen Maru Gothic',sans-serif}
  .p1-stamp .date-lg{font-size:14px;font-weight:700;fill:var(--coral);font-family:'Zen Maru Gothic',sans-serif}
  .p1-stamp .paw{fill:var(--coral)}
  .p1-center{margin-top:auto;margin-bottom:auto}
  .p1-micro{font-size:9pt;letter-spacing:.24em;color:var(--sage);font-weight:700}
  .p1-eyebrow{margin-top:5pt;font-size:10pt;letter-spacing:.2em;color:var(--brown-60)}
  .p1-hero{margin-top:10pt}
  .p1-name{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:900;color:var(--coral);
    font-size:60pt;line-height:1;margin:0;
  }
  .p1-sub{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:19pt;color:var(--brown);margin-top:7pt}
  .p1-medallion{display:flex;flex-direction:column;align-items:flex-start;margin-top:22pt}
  .p1-portrait{width:46mm;height:46mm;flex:none;border-width:3px;box-shadow:0 0 0 5px var(--milk),0 0 0 6px var(--pink-beige)}
  .p1-motif{display:flex;align-items:center;gap:8pt;margin-top:16pt;color:var(--sage)}
  .p1-motif .ln{height:1px;width:16mm;background:var(--rule)}
  .p1-motif svg{width:13pt;height:13pt;opacity:.8}
  .p1-profile{margin-top:16pt;display:flex;flex-direction:column;align-items:flex-start;gap:8pt}
  .p1-type{
    display:inline-flex;align-items:center;gap:6pt;
    border:1px solid var(--sage);color:var(--sage);border-radius:999px;padding:5pt 14pt;
    font-size:10pt;font-weight:700;flex:none;
  }
  .p1-profile-line{font-size:10.5pt;color:var(--brown-60);letter-spacing:.02em}
  .p1-foot{flex:none;padding-top:8pt;border-top:1px solid var(--rule);font-size:9pt;color:var(--brown-60)}

  /* ===== P2 今日のまとめ ===== */
  .p2 .inner,.p3 .inner{display:flex;flex-direction:column}
  .page-body{margin-top:auto;margin-bottom:auto}
  .p2 .page-body{margin-top:18pt}
  .p3 .page-body{margin-top:14pt}
  .p2-hero{display:flex;align-items:center;gap:14mm;margin-top:30pt;padding-bottom:28pt;border-bottom:1px solid var(--rule)}
  .p2-hero .char-frame{width:46mm;height:46mm;flex:none}
  .p2-hero-num{flex:1}
  .p2-hero-num .n{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:52pt;color:var(--coral);line-height:1}
  .p2-hero-num .u{font-size:11pt;color:var(--brown-60);margin-left:6pt}
  .p2-hero-num .l{font-size:10.5pt;color:var(--brown);margin-top:4pt}
  .p2-hero-num .sub{font-size:10.5pt;color:var(--brown-60);margin-top:10pt;padding-top:10pt;border-top:1px dotted var(--rule)}
  .p2-hero-num .sub b{color:var(--coral);font-weight:700;font-size:13pt;font-family:'Zen Maru Gothic',sans-serif}
  .p2-lede{font-size:14.5pt;line-height:2.3;color:var(--brown);margin-top:32pt}
  .p2-bottom{margin-top:38pt;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16pt;padding-top:26pt;border-top:1px solid var(--rule)}
  .p2-bcol .h{font-size:10pt;font-weight:700;letter-spacing:.06em;color:var(--sage)}
  .p2-bcol.watch .h{color:var(--coral)}
  .p2-bcol .t{font-size:10.5pt;line-height:1.9;margin-top:8pt;color:var(--brown)}

  /* ===== P3 性格・暮らし ===== */
  .p3-top{display:flex;gap:14mm;margin-top:14pt;align-items:center}
  .p3-lede{flex:1;font-size:13pt;line-height:2.15}
  .p3-lede .pull{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15pt;color:var(--brown);display:block;margin-bottom:9pt;line-height:1.55}
  .p3-korote{width:40mm;height:40mm;flex:none}
  .axes{margin-top:22pt;display:flex;flex-direction:column;gap:16pt;padding-bottom:20pt;border-bottom:1px solid var(--rule)}
  .axis-row{display:grid;grid-template-columns:34mm 1fr;align-items:center;gap:8mm}
  .axis-name{font-size:10.5pt;color:var(--brown-60)}
  .axis-track{position:relative;height:3px;background:var(--rule);border-radius:2px}
  .axis-dot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--coral);transform:translate(-50%,-50%)}
  .axis-caps{display:flex;justify-content:space-between;font-size:9.5pt;color:var(--brown-60);margin-top:5pt}
  .p3-buckets{margin-top:18pt;display:grid;grid-template-columns:1fr 1fr;gap:18pt 28pt}
  .p3-bucket .h{font-size:10pt;font-weight:700;letter-spacing:.06em;color:var(--sage)}
  .p3-bucket ul{margin:8pt 0 0;padding:0;list-style:none;font-size:10.5pt;line-height:2;color:var(--brown)}
  .p3-bucket .t{margin:8pt 0 0;font-size:10.5pt;line-height:1.9;color:var(--brown)}

  /* ===== P4 ごはん・栄養 ===== */
  .p4-current{font-size:10.5pt;color:var(--brown-60);margin-top:4pt}
  .p4-cond-h{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13pt;color:var(--brown);margin-top:16pt}
  .p4-pills{display:flex;gap:8pt;flex-wrap:wrap;margin-top:9pt}
  .p4-pill{border:1px solid var(--sage);color:var(--sage);border-radius:999px;padding:4pt 12pt;font-size:9.5pt;font-weight:700}
  .p4-cand-h{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13pt;color:var(--brown);margin-top:22pt}
  .p4-cand-sub{font-size:9.5pt;color:var(--brown-60);margin-top:3pt}
  .foodlist{margin-top:6pt}
  .fooditem{padding:10pt 0}
  .fooditem + .fooditem{border-top:1px solid var(--rule)}
  .fooditem .fname{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:12.5pt;color:var(--brown);line-height:1.4}
  .fooditem .ffact{font-size:9pt;color:var(--brown-60);margin-top:3pt}
  .fooditem .ftags{display:flex;flex-wrap:wrap;align-items:center;gap:6pt;margin-top:7pt}
  .fooditem .ftags-label{font-size:8.5pt;color:var(--brown-60);margin-right:2pt}
  .fooditem .ftag{font-size:8.5pt;color:var(--sage);font-weight:700;background:var(--sage-tint);border-radius:999px;padding:3pt 10pt}
  .fooditem .fnote{font-size:10pt;color:var(--brown);margin-top:7pt;line-height:1.65}
  .fooditem .fcaution{font-size:9.5pt;color:var(--coral);margin-top:6pt;line-height:1.7}
  .p4-tips{margin-top:16pt;padding-top:14pt;border-top:1px solid var(--rule)}
  .p4-tips .h{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13pt;color:var(--brown)}
  .p4-tips ul{margin:10pt 0 0;padding:0;list-style:none;font-size:11pt;line-height:2.1;color:var(--brown)}

  /* ===== P5 健診 ===== */
  .p5-groups{margin-top:22pt}
  .p5-group{padding:12pt 0}
  .p5-group + .p5-group{border-top:1px solid var(--rule)}
  .p5-gname{font-size:10pt;font-weight:700;letter-spacing:.1em;color:var(--sage)}
  .p5-values{display:flex;flex-wrap:wrap;gap:7pt 26pt;margin-top:10pt}
  .p5-val{font-size:11.5pt;color:var(--brown)}
  .p5-val b{font-weight:700}
  .p5-val .u{font-size:9.5pt;color:var(--brown-60);margin-left:3pt;font-weight:500}
  .p5-callout{
    margin-top:14pt;padding:11pt 14pt;background:var(--coral-tint);border-left:2.5px solid var(--coral);
    font-size:10.5pt;line-height:1.8;color:var(--brown);
  }
  .p5-callout .h{font-size:9pt;font-weight:700;color:var(--coral);margin-bottom:5pt}
  .p5-callout-lead{font-size:9.5pt;color:var(--brown-60);margin-bottom:7pt}
  .p5-caption{margin-top:12pt;font-size:9.5pt;color:var(--brown-60);line-height:1.75}

  /* ===== P6 3か月アクションプラン ===== */
  .timeline{margin-top:32pt;position:relative;padding-left:8mm}
  .timeline:before{content:"";position:absolute;left:2.2mm;top:4pt;bottom:4pt;width:2px;background:var(--rule)}
  .tstop{position:relative;padding-bottom:36pt}
  .tstop:last-child{padding-bottom:0}
  .tstop:before{content:"";position:absolute;left:-8mm;top:3pt;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid var(--milk);box-shadow:0 0 0 1.5px var(--coral)}
  .tstop .tlabel{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:14pt;color:var(--brown)}
  .tstop .ttext{font-size:12pt;color:var(--brown);margin-top:7pt;line-height:2}
  .tstop .tsub{font-size:10pt;color:var(--brown-60);margin-top:7pt;line-height:1.9}
  .p6-close{margin-top:26pt;padding-top:20pt;border-top:1px solid var(--rule);display:flex;align-items:center;gap:12mm}
  .p6-close .char-frame{width:40mm;height:40mm}
  .p6-close p{font-size:14pt;color:var(--brown);line-height:1.9;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
  .p6-check{margin-top:24pt;padding-top:20pt;border-top:1px solid var(--rule)}
  .p6-check .h{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13pt;color:var(--brown)}
  .p6-check .sub{font-size:9.5pt;color:var(--brown-60);margin-top:4pt}
  .p6-check-grid{margin-top:16pt;display:grid;grid-template-columns:1fr 1fr;gap:16pt 24pt}
  .p6-check-row{display:flex;align-items:baseline;gap:8pt;font-size:11pt;color:var(--brown)}
  .p6-check-row .lbl{color:var(--brown-60);font-size:10pt;flex:none;width:15mm}
  .p6-check-row .blank{flex:1;border-bottom:1px dotted var(--rule);height:1em}
  .p6-check-row .opts{flex:1;letter-spacing:.12em}

  /* ===== 社内用プレビュー操作バー（印刷時は非表示） ===== */
  .admin-bar{background:#fff;border-bottom:1px solid var(--rule);padding:16px 20px}
  .admin-inner{max-width:820px;margin:0 auto}
  .admin-title{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15px;color:var(--brown)}
  .admin-hint{font-size:12px;color:var(--brown-60);margin:6px 0 10px;line-height:1.6}
  #diagnosisDataInput{width:100%;min-height:70px;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px;border:1px solid var(--rule);border-radius:8px;box-sizing:border-box;color:var(--brown)}
  .admin-bar button{margin-top:8px;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  #diagnosisLoadStatus{margin-top:8px;font-size:12px}
  #diagnosisLoadStatus .load-ok{color:var(--sage);font-weight:700}
  #diagnosisLoadStatus .load-error{color:var(--coral);font-weight:700}
</style>
</head>
<body>

<div class="admin-bar">
  <div class="admin-inner">
    <div class="admin-title">わんにゃんごはんカルテ PDFプレビュー（社内用）</div>
    <p class="admin-hint">無料診断の結果画面からコピーした「診断データ」をここに貼り付けると、下にプレビューが生成されます。判定・計算はこのツール側では行わず、診断結果をそのまま表示するだけです。</p>
    <textarea id="diagnosisDataInput" placeholder="ここに診断データ（JSON）を貼り付けてください"></textarea>
    <button type="button" id="loadDiagnosisDataBtn">読み込んでプレビュー生成</button>
    <div id="diagnosisLoadStatus"></div>
  </div>
</div>

<div id="app"></div>

<script>
(function(){
  'use strict';

  var KOROTE = 'https://www.wannyan-gohan.com/assets/korote/';
  var BREED = 'https://www.wannyan-gohan.com/character-parts/breed/';

  // 完全一致する承認済み犬種素材（このリスト以外はすべてころてにフォールバックする）
  var EXACT_BREED_ASSETS = [
    'beagle','border_collie','cavalier','chihuahua','corgi','french_bulldog',
    'golden_retriever','italian_greyhound','labrador_retriever','maltese',
    'miniature_dachshund','miniature_schnauzer','pomeranian','pug',
    'shetland_sheepdog','shiba_inu','shih_tzu','siberian_husky','toy_poodle','yorkshire_terrier'
  ];

  var AGE_LABEL = {
    under1:'1歳未満（子犬期）', '1-6':'1〜6歳（成犬）', '7-9':'7〜9歳（中高齢）',
    '10-12':'10〜12歳（シニア）', '13+':'13歳以上（ハイシニア）'
  };
  var BREEDGROUP_LABEL = {
    toy:'超小型・小型犬', companion:'シーズー・マルチーズ・キャバリア系', retriever:'レトリーバー系',
    herding:'牧羊・作業犬系', terrier:'テリア系', hound:'猟犬・サイトハウンド系',
    spitz:'柴・スピッツ系', brachy:'短頭種', large:'大型・超大型犬', mix:'ミックス・不明'
  };
  var CURRENT_FOOD_LABEL = {
    dry:'ドライ中心', wet:'ウェット/手作り多め', mixed:'ドライ＋トッピング', therapeutic:'療法食を使用中'
  };

  // buildNextSteps()（protected）が返す固定文言のうち、システム側の自動比較機能を連想させる表現を
  // 表示層でのみ言い換える。nextSteps生成ロジック自体（src/main.js）は変更しない。
  // このマップは既知の固定文字列への完全一致マッピングのみで、任意テキストの書き換えは行わない。
  var NEXT_STEP_DISPLAY_MAP = {
    '体重を2〜4週間後に再測定し、この診断結果と比較する': '体重を2〜4週間後に再測定し、このPDFに記録した今回の値と見比べる'
  };
  function displayStepText(t){ return NEXT_STEP_DISPLAY_MAP[t] || t; }

  var LAB_GROUPS = [
    ['腎・尿', ['bun','cre','sdma','usg','upc']],
    ['肝胆道', ['alt','alp']],
    ['糖・脂質', ['glu','tg','tcho']],
    ['タンパク', ['alb','tp']],
    ['電解質・ミネラル', ['na','k','ca']],
    ['血球', ['rbc','hct','wbc','plt']]
  ];
  var LAB_META = {
    bun:['BUN','mg/dL'], cre:['Cre','mg/dL'], sdma:['SDMA','µg/dL'], usg:['尿比重',''], upc:['UPC',''],
    alt:['ALT','U/L'], alp:['ALP','U/L'],
    glu:['GLU','mg/dL'], tg:['TG','mg/dL'], tcho:['T-Cho','mg/dL'],
    alb:['ALB','g/dL'], tp:['TP','g/dL'],
    na:['Na','mmol/L'], k:['K','mmol/L'], ca:['Ca','mg/dL'],
    rbc:['RBC',''], hct:['HCT','%'], wbc:['WBC',''], plt:['PLT','万/µL']
  };

  function esc(s){
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function hasVal(v){ return v !== undefined && v !== null && String(v).trim() !== ''; }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }

  // 犬種イラスト表示ルール：exact breedが明示され、かつ完全一致する承認済み素材がある場合のみ使用。
  // それ以外（breedGroupのみ・複数犬種・mix・不明・素材なし・曖昧）はすべてころてにフォールバックする。
  // 現行の診断フローはbreedGroup（カテゴリ）のみを収集しexact breedを収集しないため、
  // 当面はこの関数は常にfallbackを返す。将来exact breed入力が追加された場合のための実装。
  function portraitSrc(a, fallback){
    var exact = a && a.exactBreed;
    if (hasVal(exact) && EXACT_BREED_ASSETS.indexOf(String(exact).trim()) !== -1) {
      return BREED + String(exact).trim() + '.png';
    }
    return KOROTE + fallback;
  }

  function axisPos(axes, idx, highKey){
    return (axes && axes[idx] === highKey) ? 75 : 25;
  }

  function buildP1(a, r){
    var name = (a.dogName || '').trim();
    var hasName = !!name;
    var displayName = hasName ? name : 'うちの子';
    var nameSize = displayName.length <= 2 ? 60 : (displayName.length <= 4 ? 44 : 32);
    var subText = hasName ? 'ちゃんの、ごはんと健康の記録' : 'の、ごはんと健康の記録';
    var portrait = portraitSrc(a, 'smile.png');
    var ageLabel = AGE_LABEL[a.age] || '';
    var breedLabel = BREEDGROUP_LABEL[a.breedGroup] || '';
    var weight = hasVal(a.weight) ? (esc(a.weight) + 'kg') : '';
    var profileParts = [ageLabel, breedLabel, weight].filter(Boolean);
    var typeName = r.type || (r.profile && r.profile.name) || '';
    var now = new Date();
    var dateDot = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate());
    var dateJp = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';

    var profileHtml = '';
    if (typeName || profileParts.length) {
      profileHtml = '<div class="p1-profile">'
        + (typeName ? '<div class="p1-type">' + esc(typeName) + '</div>' : '')
        + (profileParts.length ? '<div class="p1-profile-line">' + profileParts.join('　・　') + '</div>' : '')
        + '</div>';
    }

    return ''
      + '<div class="p1-frame"></div>'
      + '<div class="p1-topline">'
      +   '<div class="p1-brand">わんにゃんごはんカルテ</div>'
      +   '<div class="p1-stamp"><svg viewBox="0 0 100 100">'
      +     '<circle class="ring" cx="50" cy="50" r="47" stroke-width="1.6"/>'
      +     '<circle class="ring" cx="50" cy="50" r="38" stroke-width="1"/>'
      +     '<defs><path id="p1stamparc" d="M 12,50 A 38,38 0 1 1 88,50"/></defs>'
      +     '<text class="arc-label"><textPath href="#p1stamparc" startOffset="50%" text-anchor="middle">MY DOG\'S RECORD</textPath></text>'
      +     '<g class="paw" transform="translate(50,60) scale(0.62)" opacity=".9">'
      +       '<ellipse cx="0" cy="7" rx="6.5" ry="5.5"/><ellipse cx="-8" cy="-2" rx="2.6" ry="3.4"/><ellipse cx="-3" cy="-7" rx="2.6" ry="3.4"/><ellipse cx="3" cy="-7" rx="2.6" ry="3.4"/><ellipse cx="8" cy="-2" rx="2.6" ry="3.4"/>'
      +     '</g>'
      +     '<text class="date-lg" x="50" y="54" text-anchor="middle">' + dateDot + '</text>'
      +   '</svg></div>'
      + '</div>'
      + '<div class="p1-center">'
      +   '<div class="p1-micro">MY DOG\'S RECORD ・ 保存版</div>'
      +   '<div class="p1-eyebrow">うちの子のごはんと健康の記録</div>'
      +   '<div class="p1-hero"><div class="p1-name" style="font-size:' + nameSize + 'pt">' + esc(displayName) + '</div><div class="p1-sub">' + esc(subText) + '</div></div>'
      +   '<div class="p1-medallion"><div class="p1-portrait char-frame"><img src="' + portrait + '" alt=""></div></div>'
      +   '<div class="p1-motif"><span class="ln"></span><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16.5" rx="6" ry="5"/><ellipse cx="4.5" cy="9" rx="2.3" ry="3"/><ellipse cx="10" cy="5.5" rx="2.3" ry="3"/><ellipse cx="16" cy="5.5" rx="2.3" ry="3"/><ellipse cx="20.5" cy="10.5" rx="2.3" ry="3"/></svg><span class="ln"></span></div>'
      +   profileHtml
      + '</div>'
      + '<div class="p1-foot">' + dateJp + '作成／獣医師監修の考え方にもとづいて作成しています。このカルテは診断書ではありません。</div>';
  }

  function buildP2(a, r, hasHealthPage, healthPageNum){
    var name = (a.dogName || '').trim();
    var ageBreed = [AGE_LABEL[a.age], BREEDGROUP_LABEL[a.breedGroup]].filter(Boolean).join('・');
    var byline = name ? (esc(name) + '（' + ageBreed + '）') : ageBreed;
    var typeName = r.type || (r.profile && r.profile.name) || '';
    var bcs = r.bcs || '';
    var leadText = (r.profile && r.profile.lead) || '';
    var leadFirst = leadText.split('。')[0];

    var namePrefix = name ? (esc(name) + 'ちゃんは') : 'この子は';
    var weightPart = hasVal(a.weight) ? (esc(a.weight) + 'kg、') : '';
    var bcsPart = bcs ? (esc(bcs) + 'の') : '';
    var ledeExtra = leadFirst ? (esc(leadFirst) + '。') : '';
    var lede = namePrefix + weightPart + bcsPart + esc(typeName) + 'です。' + ledeExtra;

    var kcal = (typeof r.kcal === 'number' && isFinite(r.kcal) && r.kcal > 0) ? Math.round(r.kcal) : null;
    var snack = (typeof r.snack === 'number' && isFinite(r.snack) && r.snack > 0) ? Math.round(r.snack) : null;

    var heroNumHtml;
    if (kcal !== null) {
      heroNumHtml = '<div class="p2-hero-num">'
        + '<div><span class="n">' + kcal + '</span><span class="u">kcal／日</span></div>'
        + '<div class="l">目安の給与カロリー</div>'
        + (snack !== null ? '<div class="sub">そのうち、おやつは<b>' + snack + 'kcal</b>まで</div>' : '')
        + '</div>';
    } else {
      heroNumHtml = '<div class="p2-hero-num"><div class="l">目安の給与カロリーは、体重の入力から計算されます。</div></div>';
    }

    var likely = (r.profile && r.profile.likely) || [];
    var goodBullets = likely.slice(0,2);
    var watchCount = (r.redFlags || []).length + (r.watch || []).length;
    var nextSteps = r.nextSteps || [];

    var cols = [];
    if (goodBullets.length) {
      cols.push({ cls:'', h:'いいところ', body: goodBullets.map(function(t){ return '・' + esc(t); }).join('<br>') });
    }
    if (hasHealthPage && watchCount > 0) {
      cols.push({ cls:' watch', h:'見ておきたいこと', body: '健診で確認したい項目が' + watchCount + 'つあります。詳しくは健診ページ（P' + healthPageNum + '）へ。' });
    }
    if (nextSteps[0]) {
      cols.push({ cls:'', h:'今日からできること', body: esc(displayStepText(nextSteps[0])) });
    }

    var bottomHtml = '';
    if (cols.length) {
      bottomHtml = '<div class="p2-bottom" style="grid-template-columns:repeat(' + cols.length + ',1fr)">'
        + cols.map(function(c){
            return '<div class="p2-bcol' + c.cls + '"><div class="h">' + esc(c.h) + '</div><div class="t">' + c.body + '</div></div>';
          }).join('')
        + '</div>';
    }

    return ''
      + '<div class="eyebrow">EXECUTIVE SUMMARY</div>'
      + '<div class="ptitle">今日のまとめ</div>'
      + '<div class="byline">' + byline + '</div>'
      + '<div class="page-body">'
      +   '<div class="p2-hero"><div class="char-frame"><img src="' + KOROTE + 'idea.png" alt=""></div>' + heroNumHtml + '</div>'
      +   '<p class="p2-lede">' + lede + '</p>'
      +   bottomHtml
      + '</div>';
  }

  // ownerCompatの生成文（protected）は末尾に「好相性」等の相性判定文を含むことがあるため、
  // 表示層でその一文だけを除外する。判定ロジック自体（buildOwnerCompatibility等）は変更しない。
  // 元の文はすべて既存resultのverbatimテキストで、要約・言い換えは行わない（文単位の除外のみ）。
  var COMPAT_JUDGMENT_RE = /相性/;
  function safeOwnerCompatText(text){
    if (!text) return '';
    var sentences = text.split('。').map(function(s){ return s.trim(); }).filter(Boolean);
    var safe = sentences.filter(function(s){ return !COMPAT_JUDGMENT_RE.test(s); });
    return safe.map(function(s){ return s + '。'; }).join('');
  }

  function buildP3(a, r){
    var typeName = r.type || (r.profile && r.profile.name) || '';
    var leadText = (r.profile && r.profile.lead) || '';
    var leadSentences = leadText.split('。').map(function(s){ return s.trim(); }).filter(Boolean);
    // 短い主役コピー＝leadの最初の1文、概要＝2文目のみ（既存文からの選択のみで新規要約はしない）
    var pull = leadSentences[0] ? leadSentences[0] + '。' : typeName;
    var overview = leadSentences[1] ? leadSentences[1] + '。' : '';
    var axes = (r.profile && r.profile.axes) || r.axes || [];

    var likely = (r.profile && r.profile.likely) || [];
    var care = (r.profile && r.profile.care) || [];
    var compat = r.ownerCompat;
    var compatText = compat ? safeOwnerCompatText(compat.text) : '';

    // likely[]をテーマ別（安心／楽しい等）に分割すると、axisの値によっては内容と見出しが
    // 合わない項目が生じ得るため（例：'challenge'軸の文は「安心」に馴染まない）、
    // 新たな意味分類は行わず、既存配列をそのまま「この子の特徴」として一括表示する。
    var buckets = [];
    if (likely.length) buckets.push({ h:'この子の特徴', items: likely });
    if (care.length) buckets.push({ h:'接し方のヒント', items: care });
    if (compat && compatText) buckets.push({ h:'飼い主タイプ（' + esc(compat.mbti || '') + '）との暮らしのヒント', text: compatText });

    var axisRows = [
      { label:'人や環境への反応', caps:['様子を見る','積極的'], pos: axisPos(axes,0,'open') },
      { label:'新しいモノ・場所', caps:['慎重','好奇心が先'], pos: axisPos(axes,1,'challenge') },
      { label:'日々の活動量', caps:['おだやか','活発'], pos: axisPos(axes,2,'active') },
      { label:'飼い主との距離感', caps:['マイペース','そばにいたい'], pos: axisPos(axes,3,'close') }
    ];

    var axesHtml = axisRows.map(function(row){
      return '<div class="axis-row">'
        + '<div class="axis-name">' + esc(row.label) + '</div>'
        + '<div><div class="axis-track"><div class="axis-dot" style="left:' + row.pos + '%"></div></div>'
        + '<div class="axis-caps"><span>' + esc(row.caps[0]) + '</span><span>' + esc(row.caps[1]) + '</span></div></div>'
        + '</div>';
    }).join('');

    var bucketsHtml = '';
    if (buckets.length) {
      var bucketCols = Math.min(buckets.length,3);
      bucketsHtml = '<div class="p3-buckets" style="grid-template-columns:repeat(' + bucketCols + ',1fr)">'
        + buckets.map(function(b){
            var body = b.items
              ? '<ul>' + b.items.map(function(t){ return '<li>・' + esc(t) + '</li>'; }).join('') + '</ul>'
              : '<div class="t">' + esc(b.text) + '</div>';
            return '<div class="p3-bucket"><div class="h">' + b.h + '</div>' + body + '</div>';
          }).join('')
        + '</div>';
    }

    return ''
      + '<div class="eyebrow">PERSONALITY</div>'
      + '<div class="ptitle">性格・暮らし</div>'
      + '<div class="byline">' + esc(typeName) + '</div>'
      + '<div class="page-body">'
      +   '<div class="p3-top">'
      +     '<div class="p3-lede"><span class="pull">' + esc(pull) + '</span>' + esc(overview) + '</div>'
      +     '<div class="p3-korote char-frame"><img src="' + KOROTE + 'front.png" alt=""></div>'
      +   '</div>'
      +   '<div class="axes">' + axesHtml + '</div>'
      +   bucketsHtml
      + '</div>';
  }

  // 候補フードのnote（protected foodSelectionConditions由来、verbatim）は、プロフィール要約文が
  // 全商品に共通して繰り返される構造になっている。表示層で「全商品に共通する文」だけを除外し、
  // その商品固有の文（合う理由・注意点）を残す。文の言い換え・要約は一切行わない（文単位の選別のみ）。
  // ある商品で共通文を除いた結果が空になる場合（＝固有文が存在しない）は、その商品だけ元の文をそのまま使う。
  function dedupFoodNotes(foods){
    var sentenceLists = foods.map(function(f){
      return (f.note || '').split('。').map(function(s){ return s.trim(); }).filter(Boolean);
    });
    var counts = {};
    sentenceLists.forEach(function(list){
      var seen = {};
      list.forEach(function(s){
        if (seen[s]) return;
        seen[s] = true;
        counts[s] = (counts[s] || 0) + 1;
      });
    });
    var total = foods.length;
    return sentenceLists.map(function(list){
      var unique = list.filter(function(s){ return counts[s] < total; });
      var chosen = unique.length ? unique : list;
      return chosen.map(function(s){ return s + '。'; }).join('');
    });
  }

  function buildP4(a, r){
    var name = (a.dogName || '').trim();
    var currentLabel = CURRENT_FOOD_LABEL[a.currentFood];
    var currentLine = '';
    if (hasVal(a.currentFoodName) && currentLabel) currentLine = '今の主食：' + esc(a.currentFoodName) + '（' + currentLabel + '）';
    else if (hasVal(a.currentFoodName)) currentLine = '今の主食：' + esc(a.currentFoodName);
    else if (currentLabel) currentLine = '今の主食：' + currentLabel;

    var conditions = r.conditions || [];
    var foods = r.foods || [];
    var foodTips = (r.profile && r.profile.food) || [];

    var condHtml = '';
    if (conditions.length) {
      condHtml = '<div class="p4-cond-h">' + (name ? esc(name) + 'ちゃん' : 'うちの子') + 'のフード選びで大切にしたいこと</div>'
        + '<div class="p4-pills">' + conditions.map(function(c){ return '<div class="p4-pill">' + esc(c[0]) + '</div>'; }).join('') + '</div>';
    }

    var foodsHtml = '';
    if (foods.length) {
      var shownFoods = foods.slice(0,3);
      var dedupedNotes = dedupFoodNotes(shownFoods);
      var items = shownFoods.map(function(f, i){
        var fact = (f.mainProtein ? esc(f.mainProtein) + '主原料・' : '') + (f.kcal ? Math.round(f.kcal) + 'kcal/100g' : '');
        var tagsHtml = (f.reasons && f.reasons.length)
          ? '<div class="ftags"><span class="ftags-label">合う観点</span>' + f.reasons.map(function(t){ return '<span class="ftag">' + esc(t) + '</span>'; }).join('') + '</div>'
          : '';
        var noteText = dedupedNotes[i];
        var noteHtml = noteText ? '<div class="fnote">' + esc(noteText) + '</div>' : '';
        return '<div class="fooditem"><div class="fname">' + esc(f.name) + '</div>'
          + (fact ? '<div class="ffact">' + fact + '</div>' : '')
          + tagsHtml + noteHtml + '</div>';
      }).join('');
      foodsHtml = '<div class="p4-cand-h">見えている候補</div>'
        + '<div class="p4-cand-sub">順位ではなく、それぞれ違う観点で合いやすいものです。</div>'
        + '<div class="foodlist">' + items + '</div>';
    }

    var tipsHtml = '';
    if (foodTips.length) {
      tipsHtml = '<div class="p4-tips"><div class="h">続けるときのコツ</div><ul>'
        + foodTips.map(function(t){ return '<li>・' + esc(t) + '</li>'; }).join('')
        + '</ul></div>';
    }

    return ''
      + '<div class="eyebrow">NUTRITION</div>'
      + '<div class="ptitle">ごはん・栄養</div>'
      + (currentLine ? '<div class="p4-current">' + currentLine + '</div>' : '')
      + condHtml + foodsHtml + tipsHtml;
  }

  function buildP5(a, r){
    var labs = a.labs || {};
    var groups = [];
    LAB_GROUPS.forEach(function(pair){
      var gname = pair[0], keys = pair[1];
      var vals = keys.filter(function(k){ return hasVal(labs[k]); }).map(function(k){
        var meta = LAB_META[k];
        return '<div class="p5-val">' + meta[0] + ' <b>' + esc(labs[k]) + '</b>' + (meta[1] ? '<span class="u">' + meta[1] + '</span>' : '') + '</div>';
      });
      if (vals.length) groups.push({ gname: gname, valsHtml: vals.join('') });
    });

    var watchList = (r.redFlags || []).concat(r.watch || []);

    if (!groups.length && !watchList.length) return null;

    var now = new Date();
    var dateJp = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';

    var introText = groups.length
      ? ('今回入力された健診結果を、項目ごとに整理しました。' + (watchList.length ? '次回の診察で確認しておきたいテーマは、このページ下部にまとめています。' : ''))
      : '今回は数値の記録はありませんが、次回の診察で確認しておきたいテーマをまとめています。';

    var groupsHtml = groups.length
      ? '<div class="p5-groups" style="margin-top:8pt">' + groups.map(function(g){
          return '<div class="p5-group"><div class="p5-gname">' + esc(g.gname) + '</div><div class="p5-values">' + g.valsHtml + '</div></div>';
        }).join('') + '</div>'
      : '';

    var calloutHtml = watchList.length
      ? '<div class="p5-callout"><div class="h">今回の入力内容から、次回の診察で確認しておきたいテーマ</div>'
        + '<div class="p5-callout-lead">今回の回答・数値をもとに、次回の診察で触れておきたい内容です。</div>'
        + watchList.map(function(w){ return '<div>・' + esc(w.text) + '</div>'; }).join('')
        + '</div>'
      : '';

    return ''
      + '<div class="eyebrow">HEALTH CHECKUP</div>'
      + '<div class="ptitle">健診</div>'
      + '<div class="byline">今回の記録（' + dateJp + '）</div>'
      + '<p class="p2-lede" style="font-size:11pt;line-height:1.7;margin-top:10pt">' + introText + '</p>'
      + groupsHtml + calloutHtml
      + '<div class="p5-caption">数値は測定時点のものです。基準範囲・単位は健診を受けた動物病院の表記に準じます。気になる項目は、次の診察でこのページをそのままお見せください。</div>';
  }

  function buildP6(a, r){
    var name = (a.dogName || '').trim();
    var nextSteps = r.nextSteps || [];
    var recheckItems = r.recheckItems || [];

    var stopLabels;
    if (nextSteps.length >= 3) stopLabels = ['今日から','1か月後','3か月後'];
    else if (nextSteps.length === 2) stopLabels = ['今日から','次回'];
    else if (nextSteps.length === 1) stopLabels = ['次にやること'];
    else stopLabels = [];

    var eyebrow = nextSteps.length >= 2 ? '3-MONTH ACTION PLAN' : '次にやること';
    var title = nextSteps.length >= 2 ? '3か月アクションプラン' : '次にやること';
    var byline = nextSteps.length >= 2 ? '今日から、少しずつ' : '今回わかったことから、ひとつだけ';

    var shown = nextSteps.slice(0,3);
    var stopsHtml = shown.map(function(t, i){
      var isLast = i === shown.length - 1;
      return '<div class="tstop"><div class="tlabel">' + esc(stopLabels[i] || '') + '</div>'
        + '<div class="ttext">' + esc(displayStepText(t)) + '</div>'
        + (isLast && recheckItems.length ? '<div class="tsub">健診で確認したいこと：' + recheckItems.map(esc).join('／') + '</div>' : '')
        + '</div>';
    }).join('');

    var closingSubject = name ? (esc(name) + 'ちゃん') : '様子';

    return ''
      + '<div class="eyebrow">' + eyebrow + '</div>'
      + '<div class="ptitle">' + title + '</div>'
      + '<div class="byline">' + byline + '</div>'
      + (stopsHtml ? '<div class="timeline">' + stopsHtml + '</div>' : '')
      + '<div class="p6-check">'
      +   '<div class="h">次回のためにメモしておきたいこと</div>'
      +   '<div class="sub">紙に書いても、眺めるだけでも構いません。次に見返すときの手がかりになります。</div>'
      +   '<div class="p6-check-grid">'
      +     '<div class="p6-check-row"><span class="lbl">体重</span><span class="blank"></span><span style="color:var(--brown-60);font-size:10pt">kg</span></div>'
      +     '<div class="p6-check-row"><span class="lbl">BCS</span><span class="blank"></span></div>'
      +     '<div class="p6-check-row"><span class="lbl">食欲</span><span class="opts">◎　○　△</span></div>'
      +     '<div class="p6-check-row"><span class="lbl">便</span><span class="opts">◎　○　△</span></div>'
      +     '<div class="p6-check-row" style="grid-column:1/-1"><span class="lbl">メモ</span><span class="blank"></span></div>'
      +   '</div>'
      + '</div>'
      + '<div class="p6-close"><div class="char-frame"><img src="' + KOROTE + 'korote_checklist.png" alt=""></div>'
      +   '<p>また3か月後、今の' + closingSubject + 'と<br>見比べてみましょう。</p>'
      + '</div>';
  }

  function wrapPage(cls, inner, no, total){
    return '<div class="pdfpage ' + cls + '"><div class="inner">' + inner + '</div>'
      + '<div class="pagefoot"><span class="mark">わんにゃんごはんカルテ</span><span>' + no + ' / ' + total + '</span></div></div>';
  }

  function renderKarute(data){
    var a = (data && data.answers) || {};
    var r = (data && data.result) || {};

    var p1Inner = buildP1(a, r);
    var p3Inner = buildP3(a, r);
    var p4Inner = buildP4(a, r);
    var p5Inner = buildP5(a, r);
    var p6Inner = buildP6(a, r);

    var hasP5 = p5Inner !== null;
    var total = 5 + (hasP5 ? 1 : 0);
    var p2Inner = buildP2(a, r, hasP5, 5);

    var html = '<div class="doc">';
    html += '<div class="pdfpage p1"><div class="inner">' + p1Inner + '</div></div>';
    html += wrapPage('p2', p2Inner, 2, total);
    html += wrapPage('p3', p3Inner, 3, total);
    html += wrapPage('p4', p4Inner, 4, total);
    var n = 5;
    if (hasP5) { html += wrapPage('p5', p5Inner, n, total); n++; }
    html += wrapPage('p6', p6Inner, n, total);
    html += '</div>';

    document.getElementById('app').innerHTML = html;
  }

  window.renderKarute = renderKarute;

  var btn = document.getElementById('loadDiagnosisDataBtn');
  if (btn) {
    btn.addEventListener('click', function(){
      var raw = (document.getElementById('diagnosisDataInput').value || '').trim();
      var statusEl = document.getElementById('diagnosisLoadStatus');
      if (!raw) { statusEl.innerHTML = '<span class="load-error">診断データが貼り付けられていません。</span>'; return; }
      var data;
      try { data = JSON.parse(raw); }
      catch(e){ statusEl.innerHTML = '<span class="load-error">JSON形式として読み込めませんでした。</span>'; return; }
      try {
        renderKarute(data);
        statusEl.innerHTML = '<span class="load-ok">プレビューを生成しました。</span>';
      } catch(e){
        statusEl.innerHTML = '<span class="load-error">生成中にエラーが発生しました：' + esc(e && e.message || '不明なエラー') + '</span>';
      }
    });
  }

  // 自動化用フック：Workerがこのページに渡す診断データをwindow.__AUTO_DIAGNOSIS_JSON__として
  // 事前に埋め込んでおくと、手動操作なしで自動的にプレビュー（＝実PDF化対象）が生成される。
  // 手動運用（太郎さんがこのツールを直接開く場合）には一切影響しない（この変数は通常未設定のため）。
  if (typeof window.__AUTO_DIAGNOSIS_JSON__ === 'string' && window.__AUTO_DIAGNOSIS_JSON__) {
    try {
      var autoData = JSON.parse(window.__AUTO_DIAGNOSIS_JSON__);
      renderKarute(autoData);
    } catch(e){
      document.getElementById('app').innerHTML = '<p style="padding:40px;color:#b3382c">自動読み込みに失敗しました。</p>';
    }
  }
})();
</script>
</body>
