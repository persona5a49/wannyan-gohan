<script>
// タイプ名・短い説明・イラストのみを保持する表示用データ。個人情報・健診情報は一切含まない。
var TYPE_DATA = {"affectionate-runner":{"name":"慎重な甘えんぼタイプ","lead":"人懐っこく元気だけど、初めては少し確認してから動く甘えんぼ。飼い主のそばだと安心して力を発揮する。切り替え初日は少し様子を見て、匂いづけなどで安心させると進みやすい。","img":"/assets/type-guides/type-affectionate-runner.png"},"calm-observer":{"name":"静かな観察家タイプ","lead":"人懐っこいけど新しいことには慎重派。落ち着いていてマイペース。切り替えはゆっくりが基本で、匂いや粒の形を急に変えすぎないよう工夫すると進みやすい。","img":"/assets/type-guides/type-calm-observer.png"},"cautious-adventurer":{"name":"確認派の探検家タイプ","lead":"誰とでも仲良くなれる好奇心はあるが、進む前に一度確認するタイプ。活発だけどマイペース。新フードは少量から試すと成功しやすく、混ぜる割合はゆっくり増やすのがコツ。","img":"/assets/type-guides/type-cautious-adventurer.png"},"devoted-athlete":{"name":"飼い主と走る子タイプ","lead":"外では少し警戒するけれど、活発で好奇心もある。何より飼い主が一番のタイプ。慣れた自宅で新フードを試すと成功しやすく、運動量が多いのでおやつの量には注意。","img":"/assets/type-guides/type-devoted-athlete.png"},"earnest-companion":{"name":"確認派の甘えんぼタイプ","lead":"外は警戒しがちだけど、安心できる手順があれば頑張れる甘えんぼ。変化は苦手なので、小さいステップに分けて切り替え、うまくいったらしっかり褒めるのがコツ。","img":"/assets/type-guides/type-earnest-companion.png"},"easygoing-socializer":{"name":"ゆるやか社交派タイプ","lead":"誰とでも仲良くなれるのにマイペース。新しいものにも動じない自由人タイプ。新フードの切り替えはスムーズだが「食べたい時だけ食べる」傾向もあるので、置き餌より時間を決めた給餌が合いやすい。","img":"/assets/type-guides/type-easygoing-socializer.png"},"gentle-empath":{"name":"寄り添い安心派タイプ","lead":"社交的でやさしいけれど、変化はゆっくり確認したい甘えんぼ。飼い主のそばだと安定する。焦らず7〜10日以上かけて切り替え、飼い主が一緒にいる時間帯に試すと食べやすい。","img":"/assets/type-guides/type-gentle-empath.png"},"gradual-explorer":{"name":"そっと確かめ屋タイプ","lead":"外の刺激には慎重だけど、時間をかければ自分のペースで挑戦できるタイプ。切り替えはかなりゆっくりが向いていて、無理に急がず本犬のペースを尊重する。","img":"/assets/type-guides/type-gradual-explorer.png"},"happy-captain":{"name":"元気な相棒タイプ","lead":"誰にでも駆け寄る元気印。新しい場所にも一直線に飛び込み、飼い主と一緒だとさらに盛り上がるタイプ。食いつきは良いぶん早食い・おやつ欲張りに注意し、切り替え自体はスムーズでも量の管理を丁寧に。","img":"/assets/type-guides/type-happy-captain.png"},"independent-explorer":{"name":"ひとり探検家タイプ","lead":"外は少し様子見だけど、興味があれば自分から動く活発なひとり派。新フードは自分のタイミングで試させると食べやすく、無理強いせず選択肢を置いておく方法が合う。","img":"/assets/type-guides/type-independent-explorer.png"},"particular-craftsman":{"name":"こだわり職人タイプ","lead":"慎重に観察してから動く、落ち着いたマイペース派。こだわりが強く出ることもある。粒の大きさ・硬さ・香りにこだわりが出やすいので、いきなり全部替えず少しずつ慣らすのが鉄則。","img":"/assets/type-guides/type-particular-craftsman.png"},"peace-ambassador":{"name":"穏やかな人気者タイプ","lead":"社交的だけど落ち着いて過ごせるタイプ。新しい体験も穏やかに受け入れ、飼い主のそばで安心する。切り替えはスムーズな一方、穏やかな性格ゆえ食べムラのサインに気づきにくいので体重記録を。","img":"/assets/type-guides/type-peace-ambassador.png"},"quiet-craftsman":{"name":"マイペース職人タイプ","lead":"慎重で落ち着いていて、自分のペースを大切にする職人気質。新フードは少量からじっくり試し、いつもの器や場所を変えないことも安心材料になる。","img":"/assets/type-guides/type-quiet-craftsman.png"},"quiet-partner":{"name":"静かな相棒タイプ","lead":"外には慎重だけど、興味があれば挑戦する落ち着いたタイプ。飼い主と一緒だと安心。切り替えは焦らず、飼い主が近くにいる状態で少しずつ試すと進みやすい。","img":"/assets/type-guides/type-quiet-partner.png"},"reassurance-seeker":{"name":"安心第一の相棒タイプ","lead":"新しいものはまず観察するタイプ。安心できる流れと飼い主のそばが何より大事。粒サイズ・香り・硬さを見て、7〜10日以上かけて小さく変化を分け、できたことを褒めながら進める。","img":"/assets/type-guides/type-reassurance-seeker.png"},"solo-athlete":{"name":"自由な挑戦者タイプ","lead":"誰にでもフレンドリーだけど単独行動も好きな活発派。新しい環境にもすぐ飛び込む。活動量が多く消費カロリーも高めになりやすいので、フード量が足りているか体重で確認を。","img":"/assets/type-guides/type-solo-athlete.png"}};

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] }) }

(function render(){

    if(window.gtag) window.gtag('event', 'share_page_view', {result_type: data.name})
  } else {
    area.innerHTML =
      '<div class="card not-found">' +
        '<h1>診断結果が見つかりませんでした</h1>' +
        '<p>うちの子のタイプを診断してみませんか？</p>' +
      '</div>'
  }
})()
</script>
